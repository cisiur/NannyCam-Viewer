name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore NannyCam.Viewer.slnx
      - run: dotnet build NannyCam.Viewer.slnx --configuration Release --no-restore
      - run: dotnet test NannyCam.Viewer.slnx --configuration Release --no-build
